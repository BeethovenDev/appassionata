[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appassionata"
version = "0.1.0"
description = "Passive TLS & HTTP header scanner — how loudly does each host broadcast the state of its transport. Named after Beethoven's Piano Sonata No. 23."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The APPASSIONATA Authors" }]
keywords = ["tls", "hsts", "security-headers", "scanner", "passive", "league"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
appassionata = "appassionata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ARG", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true